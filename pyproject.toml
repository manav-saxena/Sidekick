[project]
name = "sidekick"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Manav Saxena", email = "Manavsaxena27.11.2002@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.3",
    "langchain>=1.4.6",
    "langchain-openai>=1.7.2",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
sidekick = "sidekick:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
